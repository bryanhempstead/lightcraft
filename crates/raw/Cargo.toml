[package]
name = "lightcraft-raw"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightCraft RAW decoding, demosaicing and DNG colour model (L1)"

[lints]
workspace = true

[dependencies]
lightcraft-tiff = { workspace = true }
lightcraft-meta = { workspace = true }
lightcraft-raster = { workspace = true }
lightcraft-color = { workspace = true }
lightcraft-geom = { workspace = true }
lightcraft-libraw-sys = { workspace = true }
# Raw Details demosaic (RCD, GPL-3.0-or-later: this fork links GPL code, Bryan 2026-11-21)
lightcraft-rcd = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
miniz_oxide = { workspace = true }
zune-jpeg = { workspace = true }
zune-core = { workspace = true }
# JPEG XL compressed DNG tiles (DNG 1.7; MIT OR Apache-2.0, pure Rust)
jxl-oxide = { workspace = true }

[dev-dependencies]
jpeg-encoder = { workspace = true }
proptest = { workspace = true }
# JPEG XL tiles for the synthetic JPEG XL DNG tests (BSD-3-Clause OR Apache-2.0)
jixel = { version = "=0.3.4" }
# Pinned CC0 corpus identities; not a product dependency.
sha2 = { version = "0.10", default-features = false, features = ["std"] }
